version: '3.8'

services:
  backend:
    build: ./Backend
    ports:
      - "3001:3001"
    restart: always
    networks:
      - shoe-network
    depends_on:
      - database

  database:
    image: redis:alpine
    restart: always
    networks:
      - shoe-network

  uptime-monitor:
    image: node:alpine
    container_name: uptime-monitor
    working_dir: /app
    volumes:
      - ./uptime-checker:/app
    command: sh -c "npm install axios && node index.js"
    restart: always
    networks:
      - shoe-network

networks:
  shoe-network:
    driver: bridge