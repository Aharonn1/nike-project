version: '3.8'

services:
  # 🛡️ ה-Reverse Proxy (Nginx) - שער הכניסה למערכת
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy # מחכה שה-Backend ידווח שהוא UP באמת
    networks:
      - shoe-network
    restart: always

  # 🚀 ה-Backend (Node.js) - הלב הלוגי
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nike-project_backend_1
    env_file:
      - ./Backend/.env
    expose:
      - "3001"
    restart: always
    networks:
      - shoe-network
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # 🏥 מנגנון ה-Self-Healing: בודק את ה-Route שיצרנו בקוד
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ⚡ שכבת ה-Caching (Redis) - לביצועים גבוהים
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    networks:
      - shoe-network

  # 🔍 שומר הסף (Uptime Monitor) - מוודא זמינות חיצונית
  uptime-monitor:
    image: node:alpine
    container_name: uptime-monitor
    working_dir: /app
    volumes:
      - ./uptime-checker:/app
    command: sh -c "npm install axios && node index.js"
    restart: always
    networks:
      - shoe-network

  # 📊 Prometheus - בסיס הנתונים שאוסף מדדים (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - shoe-network
    restart: always

  # 📈 Grafana - לוח המחוונים (Dashboard) הויזואלי
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000" # גישה דרך http://your-ip:3002
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # חובה לשנות ב-Production!
    networks:
      - shoe-network
    depends_on:
      - prometheus
    restart: always

# 🌐 הגדרת הרשת הפנימית המבודדת
networks:
  shoe-network:
    driver: bridge