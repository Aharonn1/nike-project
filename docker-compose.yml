version: '3.8'

services:
  # שומר הסף - Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"    # מאפשר גישה לאתר בפורט הסטנדרטי
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - shoe-network
    restart: always

  # ליבת המערכת - Backend
  backend:
    build: ./Backend
    # הפורט חשוף רק בתוך הרשת הפנימית ל-Proxy
    expose:
      - "3001"
    restart: always
    networks:
      - shoe-network
    depends_on:
      - database

  # בסיס הנתונים - Redis
  database:
    image: redis:alpine
    restart: always
    networks:
      - shoe-network

  # השומר - Uptime Monitor
  uptime-monitor:
    image: node:alpine
    container_name: uptime-monitor
    working_dir: /app
    volumes:
      - ./uptime-checker:/app
    command: sh -c "npm install axios && node index.js"
    restart: always
    networks:
      - shoe-network

networks:
  shoe-network:
    driver: bridge