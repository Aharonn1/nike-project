version: '3.8'

services:
  # השומר בכניסה - מנתב תנועה
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - shoe-network
    restart: always

  # הלב של המערכת - הלוגיקה
  backend:
    build: ./nike-project/Backend
    expose:
      - "3001"
    restart: always
    networks:
      - shoe-network
    depends_on:
      - redis
    # כאן אנחנו מוסיפים משתנה סביבה כדי שה-Backend ידע איפה Redis נמצא
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # שכבת ה-Caching (התוספת הסניורית)
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    networks:
      - shoe-network

  # שומר הסף - בודק שהאתר לא נופל
  uptime-monitor:
    image: node:alpine
    container_name: uptime-monitor
    working_dir: /app
    volumes:
      - ./uptime-checker:/app
    command: sh -c "npm install axios && node index.js"
    restart: always
    networks:
      - shoe-network

networks:
  shoe-network:
    driver: bridge